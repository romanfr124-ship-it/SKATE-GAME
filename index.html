<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#202020" />
  <title>SKATE — Park Blockout</title>
  <style>
    html,body,#game{width:100%;height:100%;margin:0;overflow:hidden;background:#202020}
    body{touch-action:none;overscroll-behavior:none}
    #game{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%;outline:none}
    #load-error{position:fixed;inset:0;z-index:10001;display:none;place-items:center;padding:28px;color:#eee;background:#202020;font:14px/1.5 system-ui;text-align:center;white-space:pre-wrap}
    #hardline-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 16% 16%,#16c9cb66 0,transparent 32%),radial-gradient(ellipse at 84% 25%,#ec26a866 0,transparent 36%),radial-gradient(ellipse at 52% 90%,#6338d866 0,transparent 38%),linear-gradient(145deg,#07151c 0%,#101b2c 48%,#160c20 100%);transition:opacity .6s ease,visibility .6s ease}
    #hardline-loader:before{content:"";position:absolute;inset:0;opacity:.32;background-image:radial-gradient(circle,#fff .7px,transparent 1.4px),radial-gradient(circle,#31e8e1 1px,transparent 2px),radial-gradient(circle,#ff3ca8 1px,transparent 2px);background-size:31px 29px,67px 73px,91px 83px;background-position:0 0,18px 24px,42px 12px}
    #hardline-loader .hl-load-content{position:relative;width:min(100%,650px);text-align:center;animation:hlLoadIn .8s cubic-bezier(.2,.8,.2,1) both}
    #hardline-loader img{display:block;width:100%;height:auto;max-height:48vh;object-fit:contain;filter:drop-shadow(0 9px 0 #0009) drop-shadow(0 0 20px #1eece377)}
    #hardline-loader .hl-loading-label{margin-top:26px;color:#c5fff9;font:900 10px Arial,sans-serif;letter-spacing:.42em;text-shadow:0 0 14px #16d9dc88}
    #hardline-loader .hl-loading-line{width:130px;height:3px;margin:18px auto 0;overflow:hidden;border-radius:4px;background:#ffffff22}
    #hardline-loader .hl-loading-line:after{content:"";display:block;width:42%;height:100%;border-radius:4px;background:linear-gradient(90deg,#21e7df,#ff42a5);animation:hlLoadProgress 1.25s ease-in-out infinite}
    #hardline-loader.hl-loader-out{opacity:0;visibility:hidden;pointer-events:none}
    @keyframes hlLoadIn{from{opacity:0;transform:scale(.9) rotate(-2deg)}to{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes hlLoadProgress{from{transform:translateX(-110%)}to{transform:translateX(340%)}}
    @media(prefers-reduced-motion:reduce){#hardline-loader *{animation:none!important}}
  </style>
</head>
<body>
  <div id="hardline-loader" aria-label="Loading HARDLINE">
    <div class="hl-load-content">
      <img src="./67DC0978-8FDF-4894-B013-561205F06CD4.png" alt="HARDLINE" draggable="false"/>
      <div class="hl-loading-label">SKATE THE CONCRETE</div><div class="hl-loading-line"></div>
    </div>
  </div>
  <main id="game" aria-label="3D skatepark"></main>
  <div id="load-error" role="alert"></div>
  <script type="module" src="./src/main.js?v=hardline-startup-fix-20261115"></script>
  <script>
    function showStartupError(message) {
      var box = document.getElementById('load-error');
      var loader = document.getElementById('hardline-loader');
      if (!box) return;
      box.textContent = 'The 3D game could not start:\\n' + message;
      box.style.display = 'grid';
      if (loader) loader.style.display = 'none';
    }
    window.addEventListener('error', function(e) {
      showStartupError(e.message || 'JavaScript loading error');
    });
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason;
      showStartupError(reason && reason.message ? reason.message : String(reason || 'Module loading error'));
    });
    // Never leave the decorative loading screen covering a failed or stalled boot.
    window.setTimeout(function() {
      if (!window.__HARDLINE_STARTED__) {
        showStartupError('Startup timed out after 35 seconds. Check your connection and reload; a required game module may not have loaded.');
      }
    }, 35000);
  </script>
</body>
</html>
